<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emissão de Certificados — MOCIU 2026</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- Biblioteca Fuse.js para tolerar erros de digitação e acentos -->
<script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.js"></script>

<style>
  :root{
    --bg-top:#070C1E;
    --bg-bot:#101934;
    --card-bg:#162247;
    --ink:#fbf6ea;
    --ink-soft:#c9dedb;
    --highlight:#ffd93d;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:var(--bg-top);
    padding:40px 20px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .container{
    max-width:700px;
    margin:0 auto;
    width:100%;
  }
  .back-link{
    display:inline-block;
    font-family:'Space Mono',monospace;
    font-size:13px;
    color:var(--highlight);
    text-decoration:none;
    margin-bottom:24px;
    font-weight:700;
  }
  .back-link:hover{text-decoration:underline;}

  .card-box{
    background:var(--card-bg);
    border-radius:16px;
    padding:40px;
    box-shadow:0 16px 40px rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.1);
    text-align:center;
  }

  h1{
    font-family:'Fraunces',serif;
    font-size:clamp(26px, 4vw, 34px);
    color:var(--ink);
    margin-bottom:12px;
  }
  p.desc{
    font-size:15px;
    color:var(--ink-soft);
    margin-bottom:28px;
  }

  .category-selector {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .btn-cat {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--ink-soft);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-cat:hover {
    background: rgba(255,255,255,0.15);
    color: var(--ink);
  }
  .btn-cat.active {
    background: var(--highlight);
    color: #132a36;
    border-color: var(--highlight);
    box-shadow: 0 4px 12px rgba(255,217,61,0.3);
  }

  .input-group{
    display:flex;
    flex-direction:column;
    gap:12px;
    text-align:left;
    margin-bottom:24px;
  }
  label{
    font-family:'Space Mono',monospace;
    font-size:13px;
    color:var(--highlight);
  }
  input[type="text"]{
    width:100%;
    padding:16px 20px;
    background:rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.2);
    border-radius:10px;
    color:var(--ink);
    font-size:16px;
    outline:none;
    transition:border-color .2s;
  }
  input[type="text"]:focus{
    border-color:var(--highlight);
  }

  .btn-search{
    width:100%;
    background:linear-gradient(120deg,#ffd93d,#ff9d6c);
    color:#132a36;
    font-weight:700;
    font-size:16px;
    padding:16px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,.3);
    transition:transform .15s ease;
  }
  .btn-search:hover{
    transform:translateY(-2px);
  }

  #resultArea{
    margin-top:30px;
    display:none;
    padding:24px;
    background:rgba(0,0,0,.2);
    border-radius:10px;
    border:1px dashed var(--highlight);
    text-align:center;
  }

  .btn-download-cert{
    display:inline-block;
    margin-top:16px;
    background:#3fcf8e;
    color:#070C1E;
    font-weight:700;
    padding:14px 28px;
    border-radius:8px;
    text-decoration:none;
    box-shadow:0 6px 16px rgba(63,207,142,.3);
    transition: background 0.2s;
    cursor: pointer;
    border: none;
  }
  .btn-download-cert:hover{
    background:#34b077;
  }

  .error-msg{
    color:#ff6b6b;
    font-family:'Space Mono',monospace;
    font-size:14px;
    margin-top:16px;
  }

  footer{
    text-align:center;
    margin-top:40px;
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-link">← Voltar para a Página Inicial</a>

  <div class="card-box">
    <h1>Emissão de Certificados</h1>
    <p class="desc">Selecione seu perfil abaixo e digite seu nome para localizar seu certificado da MOCIU 2026.</p>

    <div class="category-selector">
      <button class="btn-cat active" onclick="mudarPerfil('estudante', this)">🎓 Estudantes</button>
      <button class="btn-cat" onclick="mudarPerfil('orientador', this)">👨‍🏫 Orientadores</button>
      <button class="btn-cat" onclick="mudarPerfil('avaliador', this)">⭐ Avaliadores</button>
    </div>

    <div class="input-group">
      <label id="labelName" for="searchInput">Nome do Estudante:</label>
      <input type="text" id="searchInput" placeholder="Ex: Ana Luiza Corsini de Souza">
    </div>

    <button class="btn-search" onclick="buscarCertificado()">Consultar Certificado</button>

    <div id="resultArea">
      <p id="successText" style="font-weight: 600; color: #3fcf8e; margin-bottom: 8px;"></p>
      <button id="downloadBtn" onclick="abrirCertificado()" class="btn-download-cert">📄 Visualizar / Baixar Certificado</button>
    </div>

    <div id="errorArea" class="error-msg" style="display:none;">
      Nenhum certificado encontrado para este nome. Verifique a digitação.
    </div>
  </div>
</div>

<footer>
  MOCIU — Mostra de Ciências de Umuarama 2026 · Instituto Federal do Paraná
</footer>

<script>
  let perfilAtual = 'estudante';
  let urlAtual = '';

  function mudarPerfil(perfil, btn) {
    perfilAtual = perfil;
    
    document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    document.getElementById('searchInput').value = '';
    document.getElementById('resultArea').style.display = 'none';
    document.getElementById('errorArea').style.display = 'none';

    const input = document.getElementById('searchInput');
    const label = document.getElementById('labelName');

    if (perfil === 'estudante') {
      label.innerText = "Nome do Estudante:";
      input.placeholder = "Ex: Ana Luiza Corsini de Souza";
    } else if (perfil === 'orientador') {
      label.innerText = "Nome do Orientador(a):";
      input.placeholder = "Ex: Andreza Cristina Soares";
    } else if (perfil === 'avaliador') {
      label.innerText = "Nome do Avaliador(a):";
      input.placeholder = "Em breve...";
    }
  }

  const estudantes = [
    "Ana Luiza Corsini de Souza", "Antônio João de Lima Ferroni", "Carlos Eduardo de Oliveira Gabiatti", 
    "Cibele Sophia de Souza Novaes Brito", "Clara Fernandes", "Claudinei Freitas de Oliveira Junior", 
    "Débora Ribeiro de jesus", "EVALDO DE MATOS VIEIRA", "Emilly de Oliveira", "Emmanuel Juliano", 
    "Esther Aragão da Rocha Passos", "Felipe da Silva Bernardino", "Gabriel Martins Monteiro", 
    "Gabriel dos Santos Costa", "Gabrielly Moreira de Souza", "Giselle Santos Souza", 
    "Helena Gabrieli costa Rodrigues", "Heloísa Marcelino de Moraes", "Hemiliesley Malheiro Cardoso da Silva", 
    "Inglithi Novais Ribeiro", "Isaac Vasconcelos Ferreira", "Isabeli Albanezi Lino", 
    "Isabella Ribeiro de Souza", "Isabella Sayuri Sakata", "Isabelli Vitória Pirichowski Silva", 
    "Isabelly Micaela de Souza Barbosa", "Isla Rebeca dos Santos Lira Silva", "Jennefer Santos", 
    "Jhenifer Raiane Silva Lima", "Jorge Davi Guedes Cavalcante", "Jovito Gonçalves dos Santos", 
    "João Gabriel Dias Pereira", "João Victor Ribeiro Bizarri", "Kaio dos Santos Silva", 
    "LThaís Silva Moreira", "Laura Sophie Marques de Lima Silva", "Lavínia Vizetti Helbel", 
    "Luís Henrique de Souza Almeida", "Maria Clara Garcia Arantes", "Maria Clara de Lima Sardinha", 
    "Maria Clara de Souza de Silva", "Maria Isabella Santana santos", "Matheus Henrique de Mello Prado", 
    "Maísa Guezzo Cardoso", "Melissa Maia", "Miguel Antônio Bertolini Luzia", "Miguel Isac Alves", 
    "Miguel Neves Pereira", "Mylena Camiloti", "Nícolas de Souza Caparelli", "Otavio da Gama Granville", 
    "Pedro Henrique Barreto Germano", "Pedro Henrique Stulpen Vieira", "Quezia Bastos Novais", 
    "Rebeca Vitória Pereira", "Renata Cabrera", "Ruty Almeida da Silva", "Samira Lopes Cordeiro", 
    "Sofia Ribeiro Cardoso Ogando Fraiz", "Sophia Helena Appolinário Lhamas", "Sophia Pereira Ferrari", 
    "Sophia Volpato Pires", "Yasmim Ferreira de Sousa"
  ];

  const orientadores = [
    "Andreza Cristina Soares", "Bruna Tais Ferreira de Mello", "Eduardo Vedovetto Santos", 
    "Fernando Rodrigues de Carvalho", "Francisco Renato Moreira da Silva", "Gilvana Kelly Vasconcelos", 
    "Giselle Giovana do Couto de Oliveira", "Nadja Cajado da Silva", "Nailson Feitosa Nascimento", 
    "Ricardo Barbosa de Sousa", "Tamires de Lima Marques", "Tiago Oliveira Souza"
  ];

  const options = {
    includeScore: true,
    threshold: 0.4,
    ignoreLocation: true,
    ignoreFieldNorm: true
  };

  const fuseEstudantes = new Fuse(estudantes, options);
  const fuseOrientadores = new Fuse(orientadores, options);

  document.getElementById('searchInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      buscarCertificado();
    }
  });

  function buscarCertificado() {
    const inputVal = document.getElementById('searchInput').value.trim();
    const resultArea = document.getElementById('resultArea');
    const errorArea = document.getElementById('errorArea');
    const successText = document.getElementById('successText');

    errorArea.style.display = 'none';
    resultArea.style.display = 'none';

    if(!inputVal) {
      alert('Por favor, digite um nome para a busca.');
      return;
    }

    if (perfilAtual === 'avaliador') {
      errorArea.innerText = "Os certificados para avaliadores estarão disponíveis em breve.";
      errorArea.style.display = 'block';
      return;
    } else {
      errorArea.innerText = "Nenhum certificado encontrado para este nome. Verifique se o nome digitado está próximo do cadastrado.";
    }

    let result = [];
    let pasta = '';
    let prefixoArquivo = '';

    if (perfilAtual === 'estudante') {
      result = fuseEstudantes.search(inputVal);
      pasta = 'certificados';
      prefixoArquivo = 'Certificado - ';
    } else if (perfilAtual === 'orientador') {
      result = fuseOrientadores.search(inputVal);
      pasta = 'certificados_orientadores';
      prefixoArquivo = 'Certificado Orientador - ';
    }

    if(result.length > 0) {
      const nomeEncontrado = result[0].item;
      const nomeArquivo = `${prefixoArquivo}${nomeEncontrado}.pdf`;
      
      // Monta a URL usando a raiz exata do domínio do site (evita erros relativos de 404)
      urlAtual = `${window.location.origin}/${pasta}/${nomeArquivo}`;

      successText.innerHTML = `Certificado localizado para:<br><span style="color:#fff;">${nomeEncontrado}</span>`;
      resultArea.style.display = 'block';
    } else {
      errorArea.style.display = 'block';
    }
  }

  function abrirCertificado() {
    if (urlAtual) {
      window.open(urlAtual, '_blank');
    }
  }
</script>
</body>
</html>
