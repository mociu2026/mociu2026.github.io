<style>
  :root{
    --bg-top:#eaf4fb;
    --bg-bot:#8fbfe3;
    --card-bg:#fffdf7;
    --ink:#132a36;
    --ink-soft:#3c5566;
    --gold:#d4af37;
    --silver:#94a3b8;
    --bronze:#b45309;
    --highlight:#ffd93d;
    --logo-teal:#1f7d78;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:var(--bg-top);
    padding:40px 20px;
    line-height:1.6;
  }
  .container{
    max-width:1050px;
    margin:0 auto;
  }
  .back-link{
    display:inline-block;
    font-family:'Space Mono',monospace;
    font-size:13px;
    color:var(--logo-teal);
    text-decoration:none;
    margin-bottom:24px;
    font-weight:700;
  }
  .back-link:hover{text-decoration:underline;}

  header{
    text-align:center;
    margin-bottom:48px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-size:clamp(30px, 4.5vw, 42px);
    color:var(--ink);
    margin-bottom:12px;
  }
  p.subtitle{
    font-size:16px;
    color:var(--ink-soft);
    font-family:'Space Mono',monospace;
  }

  .section-title{
    font-family:'Fraunces',serif;
    font-size:24px;
    color:var(--ink);
    margin:40px 0 20px;
    border-bottom:2px solid rgba(0,0,0,.08);
    padding-bottom:8px;
    display:flex;
    align-items:center;
    gap:10px;
  }

  .grid-pods{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));
    gap:24px;
    margin-bottom:40px;
  }

  .pod-card{
    background:var(--card-bg);
    border-radius:12px;
    padding:24px;
    box-shadow:0 12px 30px rgba(19,42,54,.15);
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }

  .pod-card.gold{border-top:6px solid var(--gold);}
  .pod-card.silver{border-top:6px solid var(--silver);}
  .pod-card.bronze{border-top:6px solid var(--bronze);}
  .pod-card.champion{
    border:3px solid var(--gold);
    background:linear-gradient(135deg, #fffdf7 0%, #fef3c7 100%);
  }

  .badge{
    position:absolute;
    top:16px; 
    right:16px;
    font-family:'Space Mono',monospace;
    font-size:11px;
    font-weight:700;
    padding:6px 12px;
    border-radius:20px;
    text-transform:uppercase;
    z-index:2;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
  }
  .gold-badge{background:var(--gold); color:#132a36;}
  .silver-badge{background:var(--silver); color:#132a36;}
  .bronze-badge{background:var(--bronze); color:#fff;}

  .pod-title{
    font-family:'Fraunces',serif;
    font-size:19px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:8px;
    padding-right:90px; 
    line-height:1.2;
  }

  .pod-work{
    font-size:15px;
    font-weight:700;
    color:var(--logo-teal);
    margin-bottom:16px;
    line-height:1.4;
  }

  .pod-info{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:20px;
    flex-grow:1;
  }
  
  .info-group{
    font-size:13px;
    line-height:1.4;
    color:var(--ink-soft);
  }
  
  .info-label{
    display:block;
    font-family:'Space Mono',monospace;
    font-size:10px;
    font-weight:700;
    color:var(--ink);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin-bottom:2px;
    opacity:0.8;
  }

  .info-value{
    display:block;
    color:#2b3e4a;
  }

  /* Moldura Otimizada para fotos verticais e horizontais */
  .photo-frame{
    width: 100%;
    height: 210px; 
    background: #0f172a; /* Fundo escuro elegante que combina com qualquer proporção de foto */
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: auto;
    border: 1px solid rgba(0,0,0,.1);
    position: relative;
  }
  
  /* Ajuste inteligente: contain garante que a imagem apareça inteira sem cortes indesejados */
  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: contain; 
    object-position: center;
    transition: transform 0.35s ease;
  }

  /* Efeito de zoom ao passar o mouse */
  .photo-frame:hover img {
    transform: scale(1.08);
  }

  .photo-frame.pending {
    background: rgba(0,0,0,.04);
    border: 2px dashed rgba(0,0,0,.15);
    color: #8a8574;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    flex-direction: column;
  }

  footer{
    text-align:center;
    margin-top:60px;
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
</style>
